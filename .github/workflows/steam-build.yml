# Build the desktop wrapper for Windows and Linux on GitHub's machines and
# upload both to the Steam depots. Manual only: it runs when you press
# "Run workflow" in the Actions tab, never automatically on a push — so it
# never surprises you or spends minutes on its own.
#
# One-time setup (see desktop/README.md → CI):
#   Settings → Secrets and variables → Actions → add
#     STEAM_USERNAME    your Steam build account name
#     STEAM_CONFIG_VDF  base64 of the config.vdf from one local steamcmd login
#
# Leave the "set live" box blank to upload without publishing; pick a Steam
# branch name to also set the build live on that branch.
name: Steam build

on:
  workflow_dispatch:
    inputs:
      setlive:
        description: "Set the build live on a branch (blank = upload only)"
        required: false
        type: choice
        default: ""
        options:
          - ""
          - prerelease
          - beta
        # 'default' is deliberately NOT an option. It is the public branch —
        # the one the release checklist inspects and the one customers install
        # from — but SteamPipe will not set it live: steamcmd answers
        # "ERROR! Failed to commit build for AppID 5018290 : Failure" and the
        # whole build is discarded, depots and all. Valve requires the default
        # branch to be set live by hand on the Steamworks Builds page, which is
        # a sensible place to require a human. Upload with this box blank, then
        # go and set the build live there.

# Read-only by default. Nothing here writes to the repository, and a token
# that cannot push is one fewer thing a compromised action could do.
permissions:
  contents: read

jobs:
  # Nothing reaches a depot until the whole verify chain has passed. A red
  # night must not be uploadable: the depots are what a paying player gets.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Content validator
        run: node test/validate.js
      - name: Balance simulation, dealability and mechanics
        run: node test/simulate.js
      - name: Pure unit harnesses
        run: |
          node test/week.js
          node test/achievements.js
          node test/suspend.js
          node test/store.js
      - name: Build the shipped assets
        run: node build.js
      # The deployed assets must be the ones the sources produce — a stale
      # public/ ships yesterday's game to the website. index.html is exempt
      # because it carries the build stamp of the commit it was built at,
      # which by definition cannot exist yet when that commit is made.
      - name: The deployed assets must match the sources
        run: git diff --exit-code -- public/ ':!public/index.html'
      - name: Install Playwright
        run: npm install --no-save playwright && npx playwright install --with-deps chromium
      - name: Desk, mobile and campaign smokes
        run: |
          node test/smoke.js
          node test/mobsmoke.js
          node test/weekui.js
          node test/desktopsave.js
      # Nights are dealt at random, so the smokes above see about a fifth of
      # the deck and a different fifth each run. Nothing reaches a depot
      # until every card has been put on the desk and looked at.
      - name: Every piece of content must render
        run: node test/sweep.js

  windows:
    needs: [verify]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Build game and stage the wrapper
        run: bash tools/desktop-build.sh stage
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci
      - name: Package the Windows app
        working-directory: desktop
        run: npx electron-builder --win --dir --publish never
      # asar list prints native separators, so the Windows listing arrives
      # with backslashes — normalise before looking for anything.
      - name: The package must contain a game, not an empty shell
        shell: bash
        run: |
          set -e
          test -f "desktop/dist/win-unpacked/Duty Guvnor.exe"
          test -f desktop/dist/win-unpacked/resources/app.asar
          npx --yes asar list desktop/dist/win-unpacked/resources/app.asar | tr '\\' '/' > /tmp/asar.txt
          for want in /main.js /store.js /preload.js /game/index.html; do
            grep -q "$want" /tmp/asar.txt || { echo "MISSING FROM PACKAGE: $want"; sed -n '1,40p' /tmp/asar.txt; exit 1; }
          done
          bash tools/check-steamworks.sh desktop/dist/win-unpacked/resources /tmp/asar.txt
          echo "windows package looks like a game"
      # Packaging is not starting. Every other test runs the game as loose
      # files; the shipped thing reads itself out of app.asar, and that
      # difference has already produced two bugs that were invisible in dev.
      # So launch the actual executable and watch the parade sheet render.
      - name: Install Playwright
        run: npm install --no-save playwright
      - name: The packaged app must actually start
        run: node test/packaged.js "desktop/dist/win-unpacked/Duty Guvnor.exe"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: win-start-screenshot
          path: desktop/dist/packaged-start.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v5
        with:
          name: win-unpacked
          path: desktop/dist/win-unpacked

  linux:
    needs: [verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Build game and stage the wrapper
        run: bash tools/desktop-build.sh stage
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci
      - name: Package the Linux app
        working-directory: desktop
        run: npx electron-builder --linux --dir --publish never
      - name: The package must contain a game, not an empty shell
        run: |
          set -e
          test -x desktop/dist/linux-unpacked/duty-guvnor
          test -f desktop/dist/linux-unpacked/resources/app.asar
          npx --yes asar list desktop/dist/linux-unpacked/resources/app.asar | tr '\\' '/' > /tmp/asar.txt
          for want in /main.js /store.js /preload.js /game/index.html; do
            grep -q "$want" /tmp/asar.txt || { echo "MISSING FROM PACKAGE: $want"; sed -n '1,40p' /tmp/asar.txt; exit 1; }
          done
          bash tools/check-steamworks.sh desktop/dist/linux-unpacked/resources /tmp/asar.txt
          echo "linux package looks like a game"
      - name: Install Playwright and a display
        run: |
          npm install --no-save playwright
          sudo apt-get update && sudo apt-get install -y xvfb
      # a headless runner has no screen, and an Electron window needs one
      - name: The packaged app must actually start
        run: xvfb-run -a node test/packaged.js desktop/dist/linux-unpacked/duty-guvnor
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: linux-start-screenshot
          path: desktop/dist/packaged-start.png
          if-no-files-found: ignore
      # upload-artifact does not carry file modes, and a Linux game that
      # arrives without its executable bit does not start. Tar preserves them.
      - name: Tar the Linux package, modes and all
        run: tar -czf linux-unpacked.tar.gz -C desktop/dist linux-unpacked
      - uses: actions/upload-artifact@v5
        with:
          name: linux-unpacked-tar
          path: linux-unpacked.tar.gz

  # No Mac depot exists and none is planned — this job is here so the packaged
  # app can be launched on the machine the guvnor actually owns. It is the same
  # asar path Windows and Linux take, so a bug that only appears once the game
  # is inside an archive shows up here too, on a laptop, in a minute.
  macos:
    needs: [verify]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Build game and stage the wrapper
        run: bash tools/desktop-build.sh stage
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci
      - name: Package the macOS app
        working-directory: desktop
        run: npx electron-builder --mac --dir --publish never
      - name: The packaged app must actually start
        run: |
          set -e
          APP="$(find desktop/dist -maxdepth 2 -name '*.app' | head -1)"
          test -n "$APP"
          echo "launching $APP"
          npm install --no-save playwright
          node test/packaged.js "$APP"
      - name: Zip it for downloading
        run: |
          APP="$(find desktop/dist -maxdepth 2 -name '*.app' | head -1)"
          ditto -c -k --keepParent "$APP" duty-guvnor-mac.zip
      - uses: actions/upload-artifact@v5
        with:
          name: mac-app
          path: duty-guvnor-mac.zip

  upload-to-steam:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    # Which way this job logs in. A shared secret present means the mobile
    # authenticator route below; absent, it falls back to the cached login
    # file. Read once here so both steps can branch on the same answer —
    # `secrets` cannot be referenced from a step-level `if` directly.
    env:
      HAVE_TOTP: ${{ secrets.STEAM_SHARED_SECRET != '' }}
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: win-unpacked
          path: dist/win-unpacked
      - uses: actions/download-artifact@v5
        with:
          name: linux-unpacked-tar
          path: tar
      - name: Untar the Linux package with its modes intact
        run: |
          set -e
          mkdir -p dist
          tar -xzf tar/linux-unpacked.tar.gz -C dist
          test -x dist/linux-unpacked/duty-guvnor
          chmod +x dist/linux-unpacked/duty-guvnor
          # The setuid bit does NOT survive SteamPipe — the depot format does
          # not carry it, so a player's copy arrives 0755 however this file is
          # left here. It is set anyway because it costs nothing and helps if
          # the directory is ever used directly, but nothing should depend on
          # it: the game relies on the namespace sandbox, which is available
          # on SteamOS and every current desktop distribution. On a host with
          # unprivileged user namespaces switched off, Electron would need
          # --no-sandbox in the Steam launch options.
          if [ -f dist/linux-unpacked/chrome-sandbox ]; then chmod 4755 dist/linux-unpacked/chrome-sandbox; fi
      - name: Neither depot may be empty
        run: |
          set -e
          test -f "dist/win-unpacked/Duty Guvnor.exe"
          test -x dist/linux-unpacked/duty-guvnor
          echo "win:   $(du -sh dist/win-unpacked | cut -f1)"
          echo "linux: $(du -sh dist/linux-unpacked | cut -f1)"
      # Steam Guard, the way that does not rot.
      #
      # The cached-login-file route (STEAM_CONFIG_VDF) pastes a login token
      # into a secret and hopes it lasts. It does not: the token expires or is
      # invalidated by signing in anywhere else, and the pipeline then fails
      # with ERROR (Access Denied) at the last step of a twenty-minute build.
      # Worse, it can no longer be renewed — Valve changed steamcmd
      # (game-ci/steam-deploy#56) so a freshly generated config.vdf carries no
      # token the runner can read, and the SSFN sentry file that used to
      # accompany it is not written at all any more. Confirmed here: a file
      # minted in August logs in perfectly on the machine that made it and
      # tells the runner "Cached credentials not found."
      #
      # A TOTP is minted fresh on every run from the mobile authenticator's
      # shared secret, so there is nothing to expire and nothing to re-paste.
      - name: Mint a Steam Guard code
        id: totp
        if: env.HAVE_TOTP == 'true'
        uses: CyberAndrii/steam-totp@v1
        with:
          shared_secret: ${{ secrets.STEAM_SHARED_SECRET }}

      # depot1 -> 5018291 (Windows), depot2 -> 5018292 (Linux): the action
      # numbers depots as appId+1, appId+2, which match ours exactly.
      - name: Upload to Steam
        if: env.HAVE_TOTP == 'true'
        uses: game-ci/steam-deploy@v3
        with:
          username: ${{ secrets.STEAM_USERNAME }}
          password: ${{ secrets.STEAM_PASSWORD }}
          totp: ${{ steps.totp.outputs.code }}
          appId: 5018290
          buildDescription: ${{ github.sha }}
          rootPath: dist
          depot1Path: win-unpacked
          depot2Path: linux-unpacked
          releaseBranch: ${{ github.event.inputs.setlive }}

      # The old road, kept only until the shared secret is in place. Delete
      # this step and the HAVE_TOTP branching once it is.
      - name: Upload to Steam (cached login file)
        if: env.HAVE_TOTP != 'true'
        uses: game-ci/steam-deploy@v3
        with:
          username: ${{ secrets.STEAM_USERNAME }}
          configVdf: ${{ secrets.STEAM_CONFIG_VDF }}
          appId: 5018290
          buildDescription: ${{ github.sha }}
          rootPath: dist
          depot1Path: win-unpacked
          depot2Path: linux-unpacked
          releaseBranch: ${{ github.event.inputs.setlive }}
