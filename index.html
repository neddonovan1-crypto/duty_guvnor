<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Duty Guvnor</title>
<style>
:root {
  --amber: #ffb000;
  --amber-dim: #8a6200;
  --amber-faint: #4a3500;
  --bg: #0d0b06;
  --panel: #16120a;
  --red: #ff5533;
  --paper: #d8cfb8;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body { height: 100%; }

body {
  background: var(--bg);
  color: var(--amber);
  font-family: "Courier New", Courier, monospace;
  font-size: 15px;
  line-height: 1.45;
  text-shadow: 0 0 6px rgba(255, 176, 0, 0.35);
  overflow-x: hidden;
}

/* CRT scanlines + vignette */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 50;
  background:
    repeating-linear-gradient(0deg, rgba(0,0,0,0.18) 0px, rgba(0,0,0,0.18) 1px, transparent 1px, transparent 3px),
    radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.55) 100%);
}

#app {
  max-width: 960px;
  margin: 0 auto;
  padding: 12px;
  min-height: 100%;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

/* ---------- header ---------- */
header {
  border: 1px solid var(--amber-dim);
  padding: 8px 12px;
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  flex-wrap: wrap;
  gap: 4px 16px;
}
header .force { letter-spacing: 2px; font-weight: bold; }
header .clock { font-size: 20px; font-weight: bold; }
header .date { color: var(--amber-dim); }
header .sound {
  font: inherit;
  font-size: 12px;
  letter-spacing: 1px;
  background: transparent;
  color: var(--amber-dim);
  border: 1px solid var(--amber-dim);
  padding: 2px 8px;
  margin-left: 14px;
  cursor: pointer;
  text-shadow: inherit;
}
header .sound:hover { color: var(--amber); border-color: var(--amber); }

/* ---------- main grid ---------- */
main {
  display: grid;
  grid-template-columns: 240px 1fr;
  gap: 12px;
  flex: 1;
  align-items: start;
}
@media (max-width: 720px) {
  main { grid-template-columns: 1fr; }
}

/* ---------- status panel ---------- */
#status {
  border: 1px solid var(--amber-dim);
  background: var(--panel);
  padding: 10px 12px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
#status h2, #card h2, #logpanel h2 {
  font-size: 12px;
  letter-spacing: 2px;
  color: var(--bg);
  background: var(--amber);
  display: inline-block;
  padding: 1px 6px;
  text-shadow: none;
  align-self: flex-start;
}
.meter { margin-top: 2px; }
.meter .label {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  letter-spacing: 1px;
}
.meter .bar {
  height: 10px;
  border: 1px solid var(--amber-dim);
  margin-top: 2px;
  position: relative;
}
.meter .fill {
  position: absolute;
  inset: 1px auto 1px 1px;
  background: var(--amber);
  transition: width 0.4s;
}
.meter.low .fill { background: var(--red); }
.meter.low .label { color: var(--red); animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0.35; } }

.pips { font-size: 15px; letter-spacing: 3px; }
.pips .label { font-size: 12px; letter-spacing: 1px; display: block; }
.pips .free { color: var(--amber); }
.pips .used { color: var(--amber-faint); }

/* ---------- incident card ---------- */
#card {
  border: 1px solid var(--amber-dim);
  background: var(--panel);
  padding: 12px 14px 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  min-height: 340px;
}
#card .title {
  border-bottom: 1px dashed var(--amber-dim);
  padding-bottom: 6px;
  font-weight: bold;
  letter-spacing: 1px;
}
#card .body { white-space: pre-wrap; min-height: 90px; cursor: pointer; }
#card .body .cursor { animation: blink 0.8s steps(2) infinite; }

.choices { display: flex; flex-direction: column; gap: 6px; margin-top: auto; }
.choices button, .continue button {
  font: inherit;
  text-align: left;
  background: transparent;
  color: var(--amber);
  border: 1px solid var(--amber-dim);
  padding: 8px 10px;
  cursor: pointer;
  text-shadow: inherit;
}
.choices button:hover:not(:disabled), .continue button:hover {
  background: var(--amber);
  color: var(--bg);
  text-shadow: none;
}
.choices button:disabled {
  color: var(--amber-faint);
  border-color: var(--amber-faint);
  cursor: not-allowed;
}
.choices button .req { float: right; color: var(--amber-dim); font-size: 12px; }
.choices button:disabled .req { color: var(--red); }
.choices button:hover:not(:disabled) .req { color: var(--bg); }

.result { border-left: 3px solid var(--amber); padding-left: 10px; font-style: italic; }
.continue { display: flex; justify-content: center; margin-top: auto; }
.continue button { text-align: center; min-width: 220px; }

/* ---------- log ---------- */
#logpanel {
  border: 1px solid var(--amber-dim);
  background: var(--panel);
  padding: 10px 12px;
  grid-column: 1 / -1;
}
#log {
  margin-top: 6px;
  max-height: 130px;
  overflow-y: auto;
  font-size: 13px;
  color: var(--amber-dim);
  display: flex;
  flex-direction: column-reverse;
}
#log div { padding: 1px 0; }
#log .t { color: var(--amber); margin-right: 8px; }

/* ---------- title & ending screens ---------- */
.screen {
  border: 1px solid var(--amber-dim);
  background: var(--panel);
  padding: 28px 24px;
  text-align: center;
  display: flex;
  flex-direction: column;
  gap: 16px;
  align-items: center;
  flex: 1;
  justify-content: center;
}
.screen h1 {
  font-size: 40px;
  letter-spacing: 4px;
  line-height: 1.1;
}
.screen .sub { color: var(--amber-dim); max-width: 560px; }
.screen .rules {
  text-align: left;
  max-width: 560px;
  color: var(--amber-dim);
  font-size: 13px;
  border-top: 1px dashed var(--amber-dim);
  border-bottom: 1px dashed var(--amber-dim);
  padding: 10px 4px;
}
.screen .rules b { color: var(--amber); }
.screen .endtext { max-width: 620px; text-align: left; white-space: pre-wrap; }
.screen .outcomes {
  max-width: 620px;
  text-align: left;
  color: var(--amber-dim);
  border-top: 1px dashed var(--amber-dim);
  padding-top: 10px;
}
.screen .outcomes div { padding: 2px 0; }
.screen .stats { color: var(--amber-dim); font-size: 13px; letter-spacing: 1px; }
.screen button {
  font: inherit;
  font-size: 18px;
  letter-spacing: 2px;
  background: var(--amber);
  color: var(--bg);
  border: none;
  padding: 12px 28px;
  cursor: pointer;
}
.screen button:hover { background: #ffd25e; }
.screen.disaster h1 { color: var(--red); }

footer {
  text-align: center;
  color: var(--amber-faint);
  font-size: 12px;
  padding-bottom: 8px;
}

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}

</style>
</head>
<body>
<div id="app"></div>
<script>
/* Duty Guvnor — core game engine.
 * Pure logic, no DOM: the browser UI (src/ui.js) and the Node test harness
 * (test/*.js) both drive the game through this module.
 *
 * Roguelike structure: each shift features exactly ONE marquee saga drawn from
 * the pool (never the same one twice running), a deck of one-off incidents that
 * respects time-of-night windows and sinks recently-seen cards, and a pool of
 * chance events the player can only acknowledge. */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.Engine = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  var TURNS = 16;          // 22:00 to 06:00 in half-hour turns
  var UNITS_TOTAL = 5;
  var UNITS_MAX = 7;
  var CELLS_TOTAL = 4;
  var CELL_HOLD_TURNS = 99; // the van to Bow Street comes at six: a body holds its cell all night
  var QUIET_CHANCE = 0.10;
  var EVENT_CHANCE = 0.22;
  var AMBIENT_CHANCE = 0.3;
  var METER_KEYS = ['streets', 'brass', 'relief'];

  var QUIET_CHOICES = [
    { label: 'Brew up for the lads', result: 'Tea the colour of creosote, all round. Morale visibly improves.', effects: { relief: 4 } },
    { label: 'Catch up on the paperwork', result: 'Two hours of overdue crime sheets done in thirty minutes. The Chief Inspector will never know how close it was.', effects: { brass: 4 } },
    { label: 'Walk the ground yourself', result: 'You show the flag down the high street. Two scallywags change their plans for the evening.', effects: { streets: 4 } },
  ];

  function clamp(v) { return Math.max(0, Math.min(100, v)); }

  function shuffle(arr, rng) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(rng() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function turnClock(turn) {
    // turn 1 = 22:00, each turn +30 min
    var mins = (22 * 60 + (turn - 1) * 30) % (24 * 60);
    var h = Math.floor(mins / 60), m = mins % 60;
    return (h < 10 ? '0' : '') + h + (m < 10 ? '0' : '') + m;
  }

  function freeUnits(state) {
    var busy = 0;
    for (var i = 0; i < state.busy.length; i++) busy += state.busy[i].count;
    return state.unitsTotal - busy;
  }

  function freeCells(state) {
    return CELLS_TOTAL - state.cells.length - (state.mpInCell ? 1 : 0);
  }

  function stageById(story, id) {
    for (var i = 0; i < story.stages.length; i++) {
      if (story.stages[i].id === id) return story.stages[i];
    }
    return null;
  }

  function choiceStatus(state, choice) {
    var e = choice.effects || {};
    if ((e.dispatchUnits || 0) > freeUnits(state)) return { enabled: false, reason: 'NO UNITS SPARE' };
    if ((e.arrests || 0) > freeCells(state)) return { enabled: false, reason: 'CELLS FULL' };
    if ((e.favours || 0) < 0 && state.favours < -e.favours) return { enabled: false, reason: 'NO FAVOURS OWED' };
    return { enabled: true, reason: '' };
  }

  function pushLog(state, text) {
    state.log.push({ time: turnClock(state.turn), text: text });
  }

  // The borough decays on its own unless actively policed; the small hours are
  // worse, and the last stretch before dawn is worst of all.
  function streetsDrift(turn) {
    if (turn < 2) return 0;
    if (turn >= 13) return 5;
    return turn >= 9 ? 4 : 2;
  }

  function checkDeath(state) {
    for (var i = 0; i < METER_KEYS.length; i++) {
      if (state.meters[METER_KEYS[i]] <= 0) {
        state.over = true;
        state.ending = {
          kind: 'disaster',
          meter: METER_KEYS[i],
          title: 'SHIFT ABANDONED',
          text: state.data.meterEndings[METER_KEYS[i]],
        };
        return true;
      }
    }
    return false;
  }

  // A card may declare a time-of-night window [firstTurn, lastTurn], and an
  // event may declare maxFreeCells (e.g. 0: only fires when the cells are full).
  function eligible(state, card) {
    if (card.window && (state.turn < card.window[0] || state.turn > card.window[1])) return false;
    if (card.maxFreeCells !== undefined && freeCells(state) > card.maxFreeCells) return false;
    return true;
  }

  // Shuffle, then sink recently-seen ids so fresh material surfaces first.
  // `seen` is most-recent-first, so last night's cards sink deepest and are
  // only ever drawn when nothing else fits the hour. Draws come from the END.
  function orderedPool(items, seen, rng) {
    return shuffle(items, rng)
      .map(function (it) {
        var r = seen.indexOf(it.id);
        return { it: it, key: r === -1 ? 1e9 : r }; // finite: Infinity-Infinity is NaN and breaks sort
      })
      .sort(function (a, b) { return a.key - b.key; })
      .map(function (x) { return x.it; });
  }

  // Take the last eligible entry from a pool (mutates the pool). Cards dealt
  // on the immediately previous shift are banned outright — a quiet half hour
  // beats a rerun.
  function takeEligible(pool, state, banned) {
    for (var i = pool.length - 1; i >= 0; i--) {
      if (eligible(state, pool[i]) && banned.indexOf(pool[i].id) < 0) return pool.splice(i, 1)[0];
    }
    return null;
  }

  function pickMarquee(data, rng, lastMarquee) {
    var pool = [];
    for (var i = 0; i < data.storylines.length; i++) {
      if (data.storylines[i].id !== lastMarquee) pool.push(data.storylines[i]);
    }
    if (!pool.length) pool = data.storylines.slice();
    return pool[Math.floor(rng() * pool.length)];
  }

  function createGame(data, rng, opts) {
    rng = rng || Math.random;
    opts = opts || {};
    var seen = opts.seen || [];
    var marquee = pickMarquee(data, rng, opts.lastMarquee || null);
    var state = {
      data: data,
      rng: rng,
      turn: 0,
      meters: { streets: 55, brass: 55, relief: 55 },
      favours: 1,
      unitsTotal: UNITS_TOTAL,
      busy: [],            // [{count, turns}]
      cells: [],           // [{turnsLeft}]
      mpInCell: false,
      deck: orderedPool(data.cards, seen, rng),
      events: orderedPool(data.events || [], seen, rng),
      banned: seen.slice(0, opts.recent || 0), // last shift's cards: never dealt tonight
      quietPool: shuffle(data.quietTurns, rng),
      ambientPool: shuffle(data.ambient, rng),
      marquee: marquee.id,
      stories: {},         // marquee id -> {pending, resolved, started, outcome}
      drawn: [],           // ids of incidents/events dealt this shift (for cross-shift history)
      current: null,       // {kind, card, storyId?}
      phase: 'choose',     // 'choose' | 'result' | 'over'
      lastResult: null,
      arrestsTotal: 0,
      favoursSpent: 0,
      outcomes: [],
      log: [],
      over: false,
      ending: null,
    };
    state.stories[marquee.id] = {
      pending: { stageId: marquee.stages[0].id, dueTurn: marquee.startTurn },
      resolved: false, started: false, outcome: null,
    };
    advance(state);
    return state;
  }

  function dueStory(state) {
    // Earliest-due unresolved storyline whose stage is scheduled for now or earlier.
    var best = null, bestDue = Infinity;
    for (var i = 0; i < state.data.storylines.length; i++) {
      var s = state.data.storylines[i];
      var st = state.stories[s.id];
      if (!st || st.resolved || !st.pending) continue;
      if (st.pending.dueTurn <= state.turn && st.pending.dueTurn < bestDue) {
        best = s; bestDue = st.pending.dueTurn;
      }
    }
    return best;
  }

  function drawQuiet(state) {
    if (!state.quietPool.length) state.quietPool = shuffle(state.data.quietTurns, state.rng);
    var text = state.quietPool.pop();
    return {
      kind: 'quiet',
      card: { title: 'ALL QUIET', text: text, choices: QUIET_CHOICES },
    };
  }

  function advance(state) {
    if (state.over) return;
    state.turn++;
    state.lastResult = null;

    if (state.turn > TURNS) {
      endShift(state);
      return;
    }

    // Units come back, prisoners go off in the morning van.
    for (var i = state.busy.length - 1; i >= 0; i--) {
      if (--state.busy[i].turns <= 0) state.busy.splice(i, 1);
    }
    for (var j = state.cells.length - 1; j >= 0; j--) {
      if (--state.cells[j].turnsLeft <= 0) state.cells.splice(j, 1);
    }

    state.meters.streets = clamp(state.meters.streets - streetsDrift(state.turn));
    if (checkDeath(state)) { state.phase = 'over'; return; }

    if (state.ambientPool.length && state.rng() < AMBIENT_CHANCE) {
      pushLog(state, state.ambientPool.pop());
    }

    var story = dueStory(state);
    var card;
    if (story) {
      var st = state.stories[story.id];
      var stage = stageById(story, st.pending.stageId);
      st.pending = null;
      st.started = true;
      if (story.id === 'mp' && !st.resolved) state.mpInCell = true;
      state.current = { kind: 'story', card: stage, storyId: story.id };
    } else if (state.events.length && state.rng() < EVENT_CHANCE &&
               (card = takeEligible(state.events, state, state.banned))) {
      state.drawn.push(card.id);
      state.current = { kind: 'event', card: card };
    } else if (state.deck.length && state.rng() >= QUIET_CHANCE &&
               (card = takeEligible(state.deck, state, state.banned))) {
      state.drawn.push(card.id);
      state.current = { kind: 'incident', card: card };
    } else {
      state.current = drawQuiet(state);
    }
    state.phase = 'choose';
  }

  function choose(state, idx) {
    if (state.over || state.phase !== 'choose') return null;
    var card = state.current.card;
    var choice = card.choices[idx];
    if (!choice || !choiceStatus(state, choice).enabled) return null;

    var e = choice.effects || {};
    for (var i = 0; i < METER_KEYS.length; i++) {
      var k = METER_KEYS[i];
      if (e[k]) state.meters[k] = clamp(state.meters[k] + e[k]);
    }
    if (e.favours) {
      if (e.favours < 0) state.favoursSpent += -e.favours;
      state.favours = Math.max(0, state.favours + e.favours);
    }
    var n;
    if (e.arrests > 0) {
      for (n = 0; n < e.arrests; n++) state.cells.push({ turnsLeft: CELL_HOLD_TURNS });
      state.arrestsTotal += e.arrests;
    }
    if (e.dispatchUnits > 0) {
      state.busy.push({ count: e.dispatchUnits, turns: Math.max(1, e.dispatchTurns || 1) });
    }
    if (e.bonusUnits > 0) {
      state.unitsTotal = Math.min(UNITS_MAX, state.unitsTotal + e.bonusUnits);
    }
    if (e.seizeCount > 0) {
      // The night takes officers off the books with no say; it can only take
      // officers who are actually spare.
      var taken = Math.min(e.seizeCount, freeUnits(state));
      if (taken > 0) state.busy.push({ count: taken, turns: Math.max(1, e.seizeTurns || 2) });
    }
    if (e.releaseCells > 0) {
      // Bail, or a word from on high: bodies walk, cells come back. The
      // Honourable Member's cell is not in anyone's gift but his saga's.
      state.cells.splice(0, e.releaseCells);
    }

    pushLog(state, card.title + ' — ' + choice.label.toUpperCase());

    if (state.current.kind === 'story') {
      var story = null;
      for (n = 0; n < state.data.storylines.length; n++) {
        if (state.data.storylines[n].id === state.current.storyId) story = state.data.storylines[n];
      }
      var st = state.stories[story.id];
      if (choice.goto && stageById(story, choice.goto)) {
        st.pending = { stageId: choice.goto, dueTurn: state.turn + Math.max(1, choice.delay || 2) };
      } else {
        st.resolved = true;
        st.outcome = choice.outcome || null;
        if (choice.outcome) state.outcomes.push(choice.outcome);
        if (story.id === 'mp') state.mpInCell = false;
      }
    }

    state.lastResult = choice.result;
    state.phase = 'result';
    checkDeath(state);
    return choice;
  }

  function proceed(state) {
    if (state.phase !== 'result') return;
    if (state.over) { state.phase = 'over'; return; }
    advance(state);
  }

  function endShift(state) {
    state.over = true;
    state.phase = 'over';
    var avg = Math.round((state.meters.streets + state.meters.brass + state.meters.relief) / 3);
    var tier = null;
    var tiers = state.data.debriefs.slice().sort(function (a, b) { return b.minAvg - a.minAvg; });
    for (var i = 0; i < tiers.length; i++) {
      if (avg >= tiers[i].minAvg) { tier = tiers[i]; break; }
    }
    if (!tier) tier = tiers[tiers.length - 1];

    var outcomes = state.outcomes.slice();
    for (var j = 0; j < state.data.storylines.length; j++) {
      var s = state.data.storylines[j];
      var st = state.stories[s.id];
      if (st && st.started && !st.resolved && s.unresolvedOutcome) outcomes.push(s.unresolvedOutcome);
    }
    state.ending = {
      kind: 'debrief', avg: avg, title: tier.title, text: tier.text, outcomes: outcomes,
      stats: {
        arrests: state.arrestsTotal,
        favoursSpent: state.favoursSpent,
        cellsHeld: state.cells.length + (state.mpInCell ? 1 : 0),
      },
    };
  }

  return {
    TURNS: TURNS,
    UNITS_TOTAL: UNITS_TOTAL,
    CELLS_TOTAL: CELLS_TOTAL,
    createGame: createGame,
    choose: choose,
    proceed: proceed,
    choiceStatus: choiceStatus,
    freeUnits: freeUnits,
    freeCells: freeCells,
    turnClock: turnClock,
  };
});

</script>
<script>
/* Duty Guvnor — sound. Everything is synthesised with WebAudio (no assets),
 * pitched at "heard from the duty office": quiet, distant, period.
 * Every entry point is defensive — audio failure must never break the game. */
(function (root) {
  'use strict';

  var ctx = null, master = null, noiseBuf = null;
  var enabled = true;
  try { enabled = (root.localStorage && root.localStorage.getItem('dg_sound')) !== 'off'; } catch (e) { /* private mode */ }

  function ensure() {
    if (!enabled) return null;
    try {
      if (!ctx) {
        var AC = root.AudioContext || root.webkitAudioContext;
        if (!AC) { enabled = false; return null; }
        ctx = new AC();
        master = ctx.createGain();
        master.gain.value = 0.16;
        master.connect(ctx.destination);
        var len = Math.floor(ctx.sampleRate * 0.1);
        noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
        var d = noiseBuf.getChannelData(0);
        for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      }
      if (ctx.state === 'suspended') ctx.resume();
      return ctx;
    } catch (e) { enabled = false; return null; }
  }

  function tone(freq, type, dur, gain, when, glideTo) {
    var t0 = ctx.currentTime + (when || 0);
    var o = ctx.createOscillator();
    var g = ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t0);
    if (glideTo) o.frequency.exponentialRampToValueAtTime(glideTo, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(gain, t0 + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(master);
    o.start(t0); o.stop(t0 + dur + 0.05);

<script>
/* Duty Guvnor — browser UI. Drives src/engine.js and renders into #app. */
(function () {
  'use strict';

  var E = window.Engine;
  var DATA = window.DATA;
  var S = window.Sound;
  var app = document.getElementById('app');
  var state = null;
  var typer = null;
  var announced = null;   // last card object a sound was played for
  var announcedEnd = null;
  var typed = null;       // last card object whose text finished typing
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function typewrite(node, text, done) {
    if (typer) { clearInterval(typer); typer = null; }
    if (reduceMotion) { node.textContent = text; done(); return; }
    var i = 0;
    node.textContent = '';
    var cur = el('span', 'cursor', '█');
    node.appendChild(cur);
    function finish() {
      clearInterval(typer); typer = null;
      node.textContent = text;
      node.onclick = null;
      done();
    }
    node.onclick = finish;
    var beat = 0;
    typer = setInterval(function () {
      i += 2;
      if (i >= text.length) { finish(); return; }
      node.textContent = text.slice(0, i);
      node.appendChild(cur);
      if (++beat % 3 === 0) S.tick();
    }, 24);
  }

  function reqText(effects) {
    var e = effects || {}, parts = [];
    if (e.dispatchUnits > 0) parts.push(e.dispatchUnits + ' PC' + (e.dispatchUnits > 1 ? 's' : ''));
    if (e.arrests > 0) parts.push(e.arrests + ' CELL' + (e.arrests > 1 ? 'S' : ''));
    if (e.favours < 0) parts.push('FAVOUR');
    return parts.join(' + ');
  }

  // SIGNAL events give the player no say, so the full toll is stamped on the
  // acknowledgement — unlike incident choices, whose consequences you weigh blind.
  function tollText(effects) {
    var e = effects || {}, parts = [];
    if (e.seizeCount > 0) parts.push('-' + e.seizeCount + ' PC' + (e.seizeCount > 1 ? 's' : '') + ' FOR ' + (e.seizeTurns || 2) + ' TURNS');
    if (e.bonusUnits > 0) parts.push('+' + e.bonusUnits + ' PC TONIGHT');
    if (e.releaseCells > 0) parts.push('+' + e.releaseCells + ' CELL' + (e.releaseCells > 1 ? 'S' : '') + ' FREED');
    ['streets', 'brass', 'relief'].forEach(function (k) {
      if (e[k]) parts.push(k.toUpperCase() + (e[k] > 0 ? ' +' : ' ') + e[k]);
    });
    return parts.join(' · ');
  }

  function meterRow(name, key) {
    var v = state.meters[key];
    var m = el('div', 'meter' + (v <= 25 ? ' low' : ''));
    var lab = el('div', 'label');
    lab.appendChild(el('span', null, name));
    lab.appendChild(el('span', null, String(v)));
    var bar = el('div', 'bar');
    var fill = el('div', 'fill');
    fill.style.width = v + '%';
    bar.appendChild(fill);
    m.appendChild(lab);
    m.appendChild(bar);
    return m;
  }

  function pipRow(label, free, total, glyphFree, glyphUsed) {
    var d = el('div', 'pips');
    d.appendChild(el('span', 'label', label));
    var used = total - free;
    d.appendChild(el('span', 'free', new Array(free + 1).join(glyphFree)));
    d.appendChild(el('span', 'used', new Array(used + 1).join(glyphUsed)));
    return d;
  }

  function renderHeader() {
    var h = el('header');
    h.appendChild(el('span', 'force', 'METROPOLITAN POLICE · THORNE STREET · B RELIEF'));
    var right = el('span');
    right.appendChild(el('span', 'date', 'FRI 14 NOV 1975 '));
    right.appendChild(el('span', 'clock', state && !state.over && state.turn <= E.TURNS ? E.turnClock(state.turn) : '--:--'));
    var snd = el('button', 'sound', S.on ? 'SND ◉' : 'SND ○');
    snd.title = 'sound on/off';
    snd.onclick = function () { S.toggle(); render(); };
    right.appendChild(snd);
    h.appendChild(right);
    return h;
  }

  function cardHeading(cur) {
    if (cur.kind === 'story') return 'ONGOING GRIEF';
    if (cur.kind === 'quiet') return 'STATION';
    if (cur.kind === 'event') return 'SIGNAL — ALL STATIONS';
    if (cur.card.tone === 'grief') return 'INCIDENT — A GRIEFY ONE';
    if (cur.card.tone === 'weary') return 'INCIDENT — A WEARY ONE';
    return 'INCIDENT';
  }

  // Cross-shift memory: recently seen cards sink in the next shuffle, and the
  // same marquee saga never headlines two nights running.
  function loadHist() {
    try {
      var h = JSON.parse(window.localStorage.getItem('dg_hist') || 'null');
      if (h && typeof h === 'object') {
        return { seen: h.seen || [], recent: h.recent || 0, lastMarquee: h.lastMarquee || null };
      }
    } catch (e) { /* private mode */ }
    return { seen: [], recent: 0, lastMarquee: null };
  }

  function saveHist() {
    try {
      var seen = state.drawn.concat(loadHist().seen).slice(0, 24);
      window.localStorage.setItem('dg_hist', JSON.stringify({
        seen: seen, recent: state.drawn.length, lastMarquee: state.marquee,
      }));
    } catch (e) { /* private mode */ }
  }

  function newGame() {
    S.warm();
    state = E.createGame(DATA, Math.random, loadHist());
    render();
  }

  function announce() {
    // one sound per new card / ending, however many times render() runs
    if (state.over && state.phase === 'over') {
      if (state.ending === announcedEnd) return;
      announcedEnd = state.ending;
      saveHist();
      if (state.ending.kind === 'disaster') S.disaster();
      else S.debrief(state.ending.avg);
      return;
    }
    if (state.phase !== 'choose' || state.current === announced) return;
    announced = state.current;
    if (state.current.kind === 'story') S.saga();
    else if (state.current.kind === 'quiet') S.quiet();
    else if (state.current.kind === 'event') S.signal();
    else S.bell(state.current.card.tone === 'grief');
  }

  function renderStatus() {
    var s = el('div');
    s.id = 'status';
    s.appendChild(el('h2', null, 'STATE OF PLAY'));
    s.appendChild(meterRow('STREETS', 'streets'));
    s.appendChild(meterRow('BRASS', 'brass'));
    s.appendChild(meterRow('RELIEF', 'relief'));
    s.appendChild(pipRow('PCs AVAILABLE', E.freeUnits(state), state.unitsTotal, '●', '○'));
    s.appendChild(pipRow('CELLS FREE', E.freeCells(state), E.CELLS_TOTAL, '■', '□'));
    var f = el('div', 'pips');
    f.appendChild(el('span', 'label', 'FAVOURS OWED'));
    f.appendChild(el('span', 'free', state.favours > 0 ? new Array(state.favours + 1).join('★') : '—'));
    s.appendChild(f);
    var t = el('div', 'pips');
    t.appendChild(el('span', 'label', 'TURN'));
    t.appendChild(el('span', 'free', Math.min(state.turn, E.TURNS) + ' / ' + E.TURNS));
    s.appendChild(t);
    return s;
  }

  function renderCard() {
    var c = el('div');
    c.id = 'card';
    var cur = state.current;
    c.appendChild(el('h2', null, cardHeading(cur)));
    c.appendChild(el('div', 'title', cur.card.title));
    var body = el('div', 'body');
    c.appendChild(body);

    if (state.phase === 'result') {
      body.textContent = cur.card.text;
      var r = el('div', 'result', state.lastResult);
      c.appendChild(r);
      var cont = el('div', 'continue');
      var b = el('button', null, state.over ? '— SO IT ENDS —' : '— CARRY ON —');
      b.onclick = function () { S.carry(); E.proceed(state); render(); };
      cont.appendChild(b);
      c.appendChild(cont);
    } else {
      var choices = el('div', 'choices');
      if (state.current === typed) {
        // already typed once; a re-render (e.g. the SND toggle) must not replay it
        body.textContent = cur.card.text;
      } else {
        choices.style.visibility = 'hidden';
        typewrite(body, cur.card.text, function () {
          typed = state.current;
          choices.style.visibility = 'visible';
        });
      }
      cur.card.choices.forEach(function (choice, idx) {
        var st = E.choiceStatus(state, choice);
        var b = el('button');
        b.appendChild(el('span', null, '> ' + choice.label));
        var req = !st.enabled ? st.reason
          : cur.kind === 'event' ? tollText(choice.effects)
          : reqText(choice.effects);
        if (req) b.appendChild(el('span', 'req', req));
        b.disabled = !st.enabled;
        b.onclick = function () { S.click(); E.choose(state, idx); render(); };
        choices.appendChild(b);
      });
      c.appendChild(choices);
    }
    return c;
  }

  function renderLog() {
    var p = el('div');
    p.id = 'logpanel';
    p.appendChild(el('h2', null, 'STATION LOG'));
    var log = el('div');
    log.id = 'log';
    for (var i = state.log.length - 1; i >= 0; i--) {
      var row = el('div');
      row.appendChild(el('span', 't', state.log[i].time));
      row.appendChild(el('span', null, state.log[i].text));
      log.appendChild(row);
    }
    p.appendChild(log);
    return p;
  }

  function renderTitle() {
    var s = el('div', 'screen');
    s.appendChild(el('h1', null, 'DUTY GUVNOR'));
    s.appendChild(el('div', 'sub',
      'Friday night, November 1975. You are the Duty Inspector at Thorne Street nick, ' +
      'and for the next eight hours everything that goes wrong in this borough is yours.'));
    var rules = el('div', 'rules');
    rules.innerHTML =
      '<b>STREETS</b> is order out there. <b>BRASS</b> is your standing upstairs. ' +
      '<b>RELIEF</b> is your officers’ patience with you.<br>' +
      'Any of them hits zero, your night is over — and probably your career.<br><br>' +
      'You have <b>5 PCs</b> to send out, <b>4 cells</b> to fill — and the van to court ' +
      'doesn’t come until six, so every body you book holds its cell all night. ' +
      'One <b>favour</b> is owed to you around the manor. Spend it well. Survive until 06:00.';
    s.appendChild(rules);
    var b = el('button', null, 'BOOK ON DUTY');
    b.onclick = newGame;
    s.appendChild(b);
    return s;
  }

  function renderEnding() {
    var end = state.ending;
    var s = el('div', 'screen' + (end.kind === 'disaster' ? ' disaster' : ''));
    s.appendChild(el('h1', null, end.title));
    s.appendChild(el('div', 'endtext', end.text));
    if (end.kind === 'debrief') {
      if (end.outcomes && end.outcomes.length) {
        var o = el('div', 'outcomes');
        o.appendChild(el('b', null, 'THE NIGHT’S SAGAS:'));
        end.outcomes.forEach(function (line) { o.appendChild(el('div', null, '• ' + line)); });
        s.appendChild(o);
      }
      s.appendChild(el('div', 'stats',
        'AVERAGE STANDING ' + end.avg + ' · BODIES IN THE BOOK ' + end.stats.arrests +
        ' · STILL IN THE CELLS AT SIX ' + end.stats.cellsHeld +
        ' · FAVOURS SPENT ' + end.stats.favoursSpent));
    }
    var b = el('button', null, 'WORK ANOTHER SHIFT');
    b.onclick = newGame;
    s.appendChild(b);
    return s;
  }

  function render() {
    if (typer) { clearInterval(typer); typer = null; }
    if (state) announce();
    app.textContent = '';
    app.appendChild(renderHeader());
    if (!state) {
      app.appendChild(renderTitle());
    } else if (state.over && state.phase === 'over') {
      app.appendChild(renderEnding());
    } else {
      var main = el('main');
      main.appendChild(renderStatus());
      main.appendChild(renderCard());
      main.appendChild(renderLog());
      app.appendChild(main);
    }
    var f = el('footer', null, 'DUTY GUVNOR · a night-shift management entertainment · all characters fictitious' +
      (window.DG_BUILD ? ' · ' + window.DG_BUILD : ''));
    app.appendChild(f);
  }

  render();
})();
